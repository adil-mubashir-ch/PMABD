# configs/resnet18_cifar100_ablation_fp32.yaml
# ============================================================
# Teacher-pool ablation cell A: FP32 only -> W2A2.
#
# Teachers for stage_m6b (runner hardcodes M1+M3+M4+M5, drops missing):
#   M1 only (ResNet-56 FP32).
# Warm start: M2 (ResNet-18 FP32) — M1 is cross-arch, so the lowest-precision
#   same-arch init available when the pool has no quantized ResNet-18 teacher.
#
# Regime matches outputs/resnet18_cifar100_fixedact W2A2 (50 epochs,
# unsigned activations via cifar_ladder.py --unsigned-act).
# ============================================================

experiment:
  name: "resnet18_cifar100_ablation_fp32"
  dataset: "cifar100"
  output_dir: "./outputs/resnet18_cifar100_ablation/fp32"
  seed: 42

data:
  batch_size: 256
  num_workers: 4
  data_root: "./data"
  val_fraction: 0.10
  val_seed: 42
  n_folds: 1
  fold: 0

teacher:
  arch: "resnet56"
  pretrained: true
  checkpoint: "W:/01_MS-Thesis/1_WACV_paper_review/RESNET18/outputs/resnet18_cifar100_2bit_ladder/M1.pth"

# No stage_m3 / m4b / m5b → teacher pool collapses to [M1] only.

stage_m6b:
  name: "M1->M6b (W2A2, abl-fp32)"
  arch: "resnet18"
  init_from: "W:/01_MS-Thesis/1_WACV_paper_review/RESNET18/outputs/resnet18_cifar100_2bit_ladder/M2.pth"
  checkpoint: "M6.pth"
  bitwidth_w: 2
  bitwidth_a: 2
  epochs: 50
  patience: 50
  min_delta: 0.03
  lr: 2.0e-5
  alpha: 0.8
  beta: 0.65
  temperature: 6.0
  weighting_strategy: "entropy"
  feature_strategy: "projected"
  lambda_qat: 0.0
  grad_clip: 0.2
  eta_min_factor: 0.02
  warmup_epochs: 6
  label_smoothing: 0.03
  use_rkd: true
  quant_log_every: 5
  feat_channels: [64, 128, 256, 512]
